
spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=member-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MEMBER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/members/**

spring.cloud.gateway.server.webflux.routes[2].id=subscription-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://SUBSCRIPTION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/plans/**,/subscriptions/**

spring.cloud.gateway.server.webflux.routes[3].id=attendance-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ATTENDANCE-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/attendance/**,/facilities/**

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
